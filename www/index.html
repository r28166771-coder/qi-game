<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0b0e1a;color:#e8c36a;font:16px Georgia;display:flex;align-items:center;justify-content:center;height:100vh;letter-spacing:.2em}</style></head><body><div>仙 Загрузка…</div><script>
(async()=>{const U='https://raw.githubusercontent.com/r28166771-coder/qi-game/main/www/game.html',K='qi_game_cache';
const fix=h=>h.split('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js').join('three.min.js').split('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/').join('three-ex/');
let h=null;try{const r=await Promise.race([fetch(U+'?t='+Date.now(),{cache:'no-store'}),new Promise((_,j)=>setTimeout(j,6000))]);if(r.ok){const x=await r.text();if(x.includes('qi3d-game')){h=x;try{localStorage.setItem(K,x)}catch(e){}}}}catch(e){}
if(!h){try{h=localStorage.getItem(K)}catch(e){}}
if(!h){h=await(await fetch('game.html')).text()}
document.open();document.write(fix(h));document.close()})();
</script></body></html>
