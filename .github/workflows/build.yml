name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: three.js локально
        run: |
          cp node_modules/three/build/three.min.js www/
          cp -r node_modules/three/examples/js www/three-ex
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js|three.min.js|; s|https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/|three-ex/|g' www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - name: Полноэкранный режим и альбомная ориентация
        run: |
          sed -i 's|android:launchMode="singleTask"|android:launchMode="singleTask" android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/qiwanderer/hundredthousand/MainActivity.java <<'JAVA'
          package com.qiwanderer.hundredthousand;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              if (android.os.Build.VERSION.SDK_INT >= 28) getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              hide();
            }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hide(); }
            void hide() {
              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
            }
          }
          JAVA
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Выпуск APK
        run: gh release create "apk-${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --title "APK ${{ github.run_number }}" --latest
        env:
          GH_TOKEN: ${{ github.token }}
